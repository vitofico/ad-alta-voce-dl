[project]
name = "ad-alta-voce-dl"
version = "2026.03.16"
description = "RAI Ad Alta Voce audiobook downloader"
requires-python = ">=3.14"
dependencies = [
    "requests",
    "tqdm",
    "flask",
    "mutagen",
]

[project.scripts]
rai-dl = "rai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rai"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
