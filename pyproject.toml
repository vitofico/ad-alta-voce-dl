[project]
name = "ad-alta-voce-dl"
version = "2026.08.18"
description = "RAI Ad Alta Voce audiobook downloader"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Vito Fico" }]
keywords = ["rai", "radio3", "audiobooks", "podcast", "audiobookshelf"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
    "requests",
    "tqdm",
    "flask",
    "flask-restx",
    "mutagen",
]

[project.urls]
Repository = "https://github.com/vitofico/ad-alta-voce-dl"
Issues = "https://github.com/vitofico/ad-alta-voce-dl/issues"

[project.scripts]
rai-dl = "rai.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rai"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
